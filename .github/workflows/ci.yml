name: Validation DuckyBridge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Résoudre les dépendances (verrou initial à conserver après validation)
        run: cargo generate-lockfile
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.os }}
          path: |
            Cargo.lock
            target/release/duckybridge-agent
            target/release/duckybridge-agent.exe
          if-no-files-found: error
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo generate-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-et-rapports
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/reports/
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo generate-lockfile
      - run: cargo audit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inventaire Android
        working-directory: android-app
        run: bash gradlew :app:dependencies --configuration debugRuntimeClasspath
      - name: Revue des nouvelles dépendances
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
